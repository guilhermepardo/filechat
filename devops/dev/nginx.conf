worker_processes 6;
user www-data;

events {
        worker_connections 768;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 300;
        types_hash_max_size 2048;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
        ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';
        ssl_prefer_server_ciphers on;

        # Configuration for access logging
        log_format compression '$remote_addr - $remote_user [$time_local] '
                                   '"$request" $status $body_bytes_sent '
                                   '"$http_referer" "$http_user_agent" "$gzip_ratio" "$http_x_forwarded_for"';

        ##
        # Logging Settings
        ##

        access_log /var/www/html/storage/logs/nginx/access.log compression;
        error_log /var/www/html/storage/logs/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;
        gzip_disable "msie6";

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##
        client_max_body_size 2000M;
        client_header_buffer_size 2000M;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        large_client_header_buffers 4 100k;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            ; listen 80 default_server;
            ; listen [::]:80;
            ; server_tokens off;


            ; root /var/www/html/public;
            ; index index.php;
            ; server_name _;

            listen 80;

            root /var/www/app/public;

            index index.php index.html index.htm;
        
            charset utf-8;

            location / {
                try_files $uri $uri/ /index.php$is_args$args;
            }

            location = /favicon.ico { access_log off; log_not_found off; }
            location = /robots.txt  { access_log off; log_not_found off; }

            error_page 404 /index.php;

            location ~ \.php$ {
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass app:8000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_intercept_errors off;
                fastcgi_buffer_size 16k;
                fastcgi_buffers 4 16k;
            }

            ; location @octane {
            ;     set $suffix "";
        
            ;     if ($uri = /index.php) {
            ;         set $suffix ?$query_string;
            ;     }

        
            ;     proxy_http_version 1.1;
            ;     proxy_set_header Host $http_host;
            ;     proxy_set_header Scheme $scheme;
            ;     proxy_set_header SERVER_PORT $server_port;
            ;     proxy_set_header REMOTE_ADDR $remote_addr;
            ;     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            ;     proxy_set_header Upgrade $http_upgrade;
            ;     proxy_set_header Connection $connection_upgrade;
        
            ;     proxy_pass http://127.0.0.1:8000$suffix;
            ; }
        }
}